<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ページが見つかりません ― 英語リズム・トレーニング</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='6' cy='16' r='5' fill='%23c4502f'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23b8ab9a'/%3E%3Ccircle cx='26' cy='16' r='5' fill='%23c4502f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f6f1e7; --paper: #fffdf8; --ink: #2b2620; --muted: #7a6f62; --line: #e2d9ca; --accent: #c4502f; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--ink);
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
.card { max-width: 480px; width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; }
.code { font-size: 48px; font-weight: 700; color: var(--accent); margin: 0; letter-spacing: .05em; }
h1 { font-size: 20px; margin: 8px 0 12px; }
p { color: var(--muted); line-height: 1.8; margin: 0 0 24px; }
a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 700; }
</style>
</head>
<body>
<main class="card">
  <p class="code">404</p>
  <h1>このページは、リズムから外れてしまったようです。</h1>
  <p>お探しのページは見つかりませんでした。URLが変わったか、入力に誤りがあるかもしれません。</p>
  <a class="btn" href="/">英語リズム・トレーニングのトップへ →</a>
</main>
<script src="https://my.habatakijuku.com/sync.js" defer></script>
</body>
</html>
